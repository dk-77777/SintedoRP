.profile-choice .button {

.access-help {

.access-help a {

.narrow-page {

.form-card {

}
.form-card > .eyebrow {

.form-grid {

.form-actions {

}
.choice-field {

.choice-field legend {

.choice-field label {

}
input[type="checkbox"],

}
.checkbox-label {

}

.summary-list {

}
.summary-list dt {

}
.summary-list dd {

}
.info-grid {

  gap: 25px;
}
.numbered-list {

  font-size: 14px;
  line-height: 1.9;
  margin-bottom: 28px;
}
.numbered-list li {

  padding-left: 5px;
}
.prose h2 {
  margin-top: 25px;
  margin-bottom: 12px;
}
.prose h2:first-child {

}
.prose p {

  color: var(--muted);
  line-height: 1.9;
}
.prose .button {
  margin-top: 25px;
}
.feedback {

  align-items: flex-start;
  gap: 12px;

  color: var(--brand);

}
.feedback > svg {

}
.feedback span {

}
.feedback button {

  color: inherit;
}
.workspace-background {
  background: var(--cream);
}
.workspace-layout {

  grid-template-columns: 215px minmax(0, 1fr);
  gap: 42px;
  padding-block: 37px 65px;

}
.workspace-sidebar {
  padding-top: 5px;
}
.sidebar-profile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin-bottom: 23px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.avatar {

  flex-shrink: 0;
  width: 40px;
  height: 40px;
  align-items: center;

}
.avatar.large {

  height: 52px;

}
.sidebar-profile strong {

}
.sidebar-profile > span:last-child {

}
.workspace-sidebar nav {

  flex-direction: column;
  gap: 5px;
}
.workspace-sidebar nav a {

}

}
.workspace-sidebar nav a:hover {

}
.sidebar-help {
  border-top: 1px solid var(--line);
  margin-top: 30px;
  padding-top: 24px;
  color: var(--brand);
}
.sidebar-help p {
  font-size: 11px;
  margin-block: 12px 17px;
  color: var(--muted);
}
.sidebar-help a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 600;
}
.workspace-content {
  min-width: 0;
  padding-top: 7px;
}
.workspace-content .page-title h1 {
  font-family: Georgia, serif;
  font-size: 35px;
  max-width: 600px;
}
.workspace-content .page-title .muted {
  font-size: 12px;
  max-width: 510px;
}
.workspace-content .page-title .eyebrow {
  font-size: 9px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
  margin-bottom: 28px;
}
.stat-card {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 21px;
}
.stat-card > svg {
  color: var(--muted);

  grid-row: 1;
}
.stat-card strong {
  grid-column: 1;
  grid-row: 1;
  font-size: 31px;
  line-height: 1;
  font-weight: 500;
  color: var(--brand);
}
.stat-card span {
  grid-column: 1 / 3;
  font-size: 10px;
  margin-top: 14px;
  color: var(--muted);
}
.welcome-panel {
  display: flex;
  align-items: center;
  gap: 25px;
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 27px;
  margin-block: 25px;
}
.welcome-icon {
  width: 77px;
  height: 77px;
  display: grid;
  place-items: center;
  color: var(--brand);
  border-radius: 50%;
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.welcome-panel h2 {
  font-family: Georgia, serif;
  font-size: 27px;
}
.welcome-panel p {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}
.welcome-panel .inline-link {
  margin-top: 13px;
}
.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 30px 0 20px;
}
.panel-heading h2 {
  font-size: 23px;
}
.panel-heading .field {

  min-width: 160px;
}
.panel-heading .field > label {

}
.record-list {
  display: flex;
  flex-direction: column;
  gap: 17px;
}
.record-card {
  padding: 25px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow-wrap: anywhere;
}
.record-card > p {
  font-size: 13px;
  margin-top: 12px;
}
.record-card .eyebrow {
  font-size: 9px;
  margin-bottom: 7px;
}
.record-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}
.record-top h3 {
  font-size: 18px;
  font-weight: 500;
}
.record-top .muted {
  font-size: 11px;
  margin-top: 8px;
}
.record-actions {
  display: flex;
  align-items: center;
  gap: 17px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  border-radius: 4px;
  padding: 6px 9px;
  font-size: 9px;
  line-height: 1.4;
}
.status-dot {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}
.badge.green {
  background: #e6eedf;
  color: #356033;
}
.badge.amber {
  background: #f5ead5;
  color: #80612b;
}
.badge.red {
  background: #f6e6e0;
  color: #934737;
}
.badge.blue {
  background: #e5edf0;
  color: #395d70;
}
.badge.gray {
  background: var(--cream);
  color: var(--muted);
}
.moderation-note {
  padding: 14px;
  background: #f7f2e7;
  color: #78623b;
  font-size: 12px;
  border-radius: 5px;
}
.error-text {
  padding: 11px;
  background: #f8e9e4;
  color: #983d2e;
  border-radius: 4px;
  font-size: 12px;
  margin-bottom: 16px;
}
.profile-form-heading,
.candidate-header {
  display: flex;
  align-items: center;
  gap: 13px;
}
.profile-form-heading {
  margin-bottom: 30px;
}
.profile-form-heading h2 {
  margin-bottom: 7px;
  font-size: 23px;
}
.candidate-header h3 {
  font-size: 15px;
}
.messages-layout {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  min-height: 430px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
}
.conversation-list {
  border-right: 1px solid var(--line);
  padding: 10px;
}
.conversation-list button {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  width: 100%;
  background: none;
  padding: 14px 10px;
  text-align: left;
  color: var(--ink);
  border-radius: 5px;
}
.conversation-list button.selected {
  background: var(--cream);
}
.conversation-list strong {
  display: block;
  font-size: 11px;
  line-height: 1.5;
}
.conversation-list small {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin-top: 4px;
}
.conversation-list .avatar {
  width: 31px;
  height: 31px;
  font-size: 10px;
}
.chat-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.chat-heading {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 21px;
  border-bottom: 1px solid var(--line);
}
.chat-heading h2 {
  font-size: 14px;
  letter-spacing: 0;
}
.chat-heading p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}
.chat-heading .text-button {
  font-size: 10px;
}
.chat-messages {
  padding: 24px 21px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 15px;
  flex: 1;
  min-height: 260px;
  max-height: 450px;
  overflow-y: auto;
}
.message-bubble {
  padding: 13px 16px;
  border-radius: 8px;
  max-width: 88%;
  overflow-wrap: anywhere;
}
.message-bubble.incoming {
  background: var(--cream);
}
.message-bubble.outgoing {
  background: var(--accent-soft);
  align-self: flex-end;
}
.message-bubble span {
  font-size: 8px;
  color: var(--muted);
}
.message-bubble p {
  font-size: 12px;
  margin-top: 5px;
  white-space: pre-wrap;
}
.chat-empty {
  margin: auto;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  max-width: 250px;
}
.message-form {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid var(--line);
}
.message-form label {
  flex: 1;
}
.message-form textarea {
  min-height: 48px;
  font-size: 12px;
}
.message-form button {
  align-self: flex-end;
  min-width: 47px;
  padding: 13px;
}
.review-form {
  border-top: 1px solid var(--line);
  padding-top: 24px;
  margin-top: 25px;
}
.stars {
  display: inline-block;
  color: #8b672d;
  font-size: 21px;
  letter-spacing: 3px;
  margin-top: 15px;
}
.review-result p {
  font-size: 13px;
  margin-top: 7px;
}
.review-result small {
  color: var(--muted);
  font-size: 10px;
}
.report-filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 17px;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 12px;
}
caption {
  padding: 19px;
  font-size: 13px;
  text-align: left;
  font-weight: 500;
}
th,
td {
  padding: 15px 18px;
  border-top: 1px solid var(--line);
}
thead th {
  color: var(--muted);
  background: var(--cream);
  font-size: 10px;
  font-weight: 500;
}
tbody th {
  font-weight: 500;
}
.loading,
.gate {
  padding-block: 70px;
  min-height: 450px;
}

/* Aplicação conectada ao servidor */
.live-form fieldset,
form fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.live-form {
  margin-block: 18px;
}

  margin-top: 12px;
}
.live-record {
  margin-block: 18px;
}
.record-heading {
  display: flex;

  gap: 20px;
  flex-wrap: wrap;
}
.inline-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.preserve-lines {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.live-workspace {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  gap: 35px;
  padding-block: 40px 70px;
}

  border: 1px solid var(--line);

  padding: 24px 18px;

}

  display: grid;
  gap: 5px;
  margin-block: 20px;
}

  padding: 10px 12px;
  border-radius: 8px;
  color: var(--ink);
}

  background: var(--brand);
  color: white;
}
.live-workspace-content {
  min-width: 0;
}
.conversation-link {
  display: grid;
  gap: 6px;
  padding: 18px;
  border-bottom: 1px solid var(--line);
}
.conversation-link.selected {
  background: var(--accent-soft);
}
.conversation-link span {
  font-size: 13px;
}
.chat-panel .live-form {
  margin: 0;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
}
.live-workspace details {
  margin-block: 18px;
}
summary {
  cursor: pointer;
  font-weight: 600;
  padding-block: 8px;
}

  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-block: 18px;
  font-size: 14px;
  flex-wrap: wrap;
}

  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

}

  text-align: left;
  margin-block: 12px;
  font-weight: 600;
}
.form-card > .button + .button {

    grid-template-columns: minmax(0, 1fr);
